apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-backend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/myorg/gitops-infra-repo.git'
    targetRevision: HEAD
    path: apps/backend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: backend-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
